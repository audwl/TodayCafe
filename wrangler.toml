# Next.js static export를 Cloudflare Workers Static Assets로 배포합니다.
name = "todaycafe"
compatibility_date = "2026-09-28"
main = "./worker/index.ts"
# Preserve runtime variables configured in the Cloudflare dashboard across deploys.
keep_vars = true

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "todaycafe-db"
database_id = "5f2c56f0-7abf-41d2-ae9d-1a615d5a34b2"
migrations_dir = "migrations"
